# Netlify. For Cloudflare Pages or Vercel use the same settings:
#   build command: npm run build    output directory: _site    Node 22
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
